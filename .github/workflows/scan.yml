name: Security Vulnerability Scan

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  # schedule:
  #   # Run every day at midnight UTC to catch newly disclosed CVEs
  #   - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # Required to upload SARIF results to GitHub Security tab
  actions: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Bandit – Python Static Analysis (SAST)
  # ─────────────────────────────────────────────
  bandit:
    name: "🐍 Bandit – Python SAST"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install bandit[sarif]

      - name: Run Bandit scan
        run: |
          bandit \
            --recursive . \
            --exclude ./.venv,./venv,./env,./.git,./tests \
            --severity-level medium \
            --confidence-level medium \
            --format sarif \
            --output bandit-results.sarif \
            || true        # Don't fail the step; let SARIF upload surface findings

      - name: Upload Bandit SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Print human-readable Bandit summary
        if: always()
        run: |
          bandit \
            --recursive . \
            --exclude ./.venv,./venv,./env,./.git,./tests \
            --severity-level medium \
            --confidence-level medium \
            --format text \
            || true

      - name: Upload Bandit SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-sarif
          path: bandit-results.sarif
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 2: Trivy – Filesystem & Dependency Scan
  # ─────────────────────────────────────────────
  trivy-fs:
    name: "🔍 Trivy – Filesystem Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (table output)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."
          format: table
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"   # Surface findings without failing the job

      - name: Run Trivy filesystem scan (SARIF output)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."
          format: sarif
          output: trivy-fs-results.sarif
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy filesystem SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

      - name: Upload Trivy FS artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-sarif
          path: trivy-fs-results.sarif
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 3: Trivy – Container Image Scan
  # (only runs when a Dockerfile is present)
  # ─────────────────────────────────────────────
  trivy-image:
    name: "🐳 Trivy – Container Image Scan"
    runs-on: ubuntu-latest
    if: ${{ hashFiles('Dockerfile') != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-vulnerability-scanner:${{ github.sha }} .

      - name: Run Trivy image scan (table output)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ai-vulnerability-scanner:${{ github.sha }}
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "1"   # Fail on CRITICAL/HIGH in container images

      - name: Run Trivy image scan (SARIF output)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: image
          image-ref: ai-vulnerability-scanner:${{ github.sha }}
          format: sarif
          output: trivy-image-results.sarif
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy image SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Upload Trivy image artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-sarif
          path: trivy-image-results.sarif
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 4: Grype – SCA Dependency Scan
  # ─────────────────────────────────────────────
  grype:
    name: "⚓ Grype – SCA Dependency Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (for requirements.txt / poetry lock generation)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies (if requirements.txt exists)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install .
          fi

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run Grype scan on filesystem (table output)
        run: |
          grype dir:. \
            --fail-on critical \
            --output table \
            || true

      - name: Run Grype scan on filesystem (SARIF output)
        run: |
          grype dir:. \
            --output sarif \
            --file grype-results.sarif \
            || true

      - name: Upload Grype SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: grype-results.sarif
          category: grype

      - name: Upload Grype artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-sarif
          path: grype-results.sarif
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 5: Summary – Aggregate all scan results
  # ─────────────────────────────────────────────
  scan-summary:
    name: "📋 Scan Summary"
    runs-on: ubuntu-latest
    needs: [ bandit, trivy-fs, grype ]
    if: always()

    steps:
      - name: Download all SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          path: sarif-reports

      - name: Print scan summary
        run: |
          echo "=============================================="
          echo "        SECURITY SCAN SUMMARY"
          echo "=============================================="
          echo ""
          echo "Scan results are available in:"
          echo "  → GitHub Security tab (Code scanning alerts)"
          echo "  → Workflow artifacts (sarif-reports/)"
          echo ""
          echo "Jobs status:"
          echo "  Bandit  (SAST)       : ${{ needs.bandit.result }}"
          echo "  Trivy FS (deps/code) : ${{ needs.trivy-fs.result }}"
          echo "  Grype   (SCA)        : ${{ needs.grype.result }}"
          echo "=============================================="
