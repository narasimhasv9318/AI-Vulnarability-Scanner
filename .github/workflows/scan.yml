name: Security Vulnerability Scan

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  schedule:
    # Run every day at midnight UTC to catch newly disclosed CVEs
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: read
  actions: read
  security-events: write  # Required for SARIF uploads → Copilot Autofix

jobs:
  # ─────────────────────────────────────────────
  # JOB 0: Pre-flight – detect repo characteristics
  # ─────────────────────────────────────────────
  preflight:
    name: "🔎 Pre-flight Checks"
    runs-on: ubuntu-latest
    outputs:
      has_dockerfile: ${{ steps.check.outputs.has_dockerfile }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: check
        run: |
          if [ -f "Dockerfile" ]; then
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
            echo "✅ Dockerfile found – container scan will run"
          else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No Dockerfile found – skipping container scan"
          fi

  # ─────────────────────────────────────────────
  # JOB 1: Bandit – Python Static Analysis (SAST)
  # ─────────────────────────────────────────────
  bandit:
    name: "🐍 Bandit – Python SAST"
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install bandit[sarif]

      - name: Run Bandit scan (text report)
        run: |
          bandit \
            --recursive . \
            --exclude ./.venv,./venv,./env,./.git,./tests \
            --severity-level medium \
            --confidence-level medium \
            --format text \
            --output bandit-report.txt \
            || true

      - name: Print Bandit summary
        if: always()
        run: cat bandit-report.txt || echo "No bandit report generated"

      - name: Run Bandit scan (JSON report)
        if: always()
        run: |
          bandit \
            --recursive . \
            --exclude ./.venv,./venv,./env,./.git,./tests \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-report.json \
            || true

      - name: Run Bandit scan (SARIF report – for Copilot Autofix)
        if: always()
        run: |
          bandit \
            --recursive . \
            --exclude ./.venv,./venv,./env,./.git,./tests \
            --severity-level medium \
            --confidence-level medium \
            --format sarif \
            --output bandit-report.sarif \
            || true

      - name: Upload Bandit SARIF → GitHub Code Scanning (Copilot Autofix)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-report.sarif
          category: bandit-sast

      - name: Upload Bandit reports (artifacts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-reports
          path: |
            bandit-report.txt
            bandit-report.json
            bandit-report.sarif
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 2: Trivy – Filesystem & Dependency Scan
  # ─────────────────────────────────────────────
  trivy-fs:
    name: "🔍 Trivy – Filesystem Scan"
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run Trivy filesystem scan (table – informational)
        run: |
          trivy fs . \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 \
            --format table \
            || true

      - name: Run Trivy filesystem scan (JSON report)
        if: always()
        run: |
          trivy fs . \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 \
            --format json \
            > trivy-fs-results.json 2>&1 \
            || true

      - name: Run Trivy filesystem scan (SARIF report – for Copilot Autofix)
        if: always()
        run: |
          trivy fs . \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 \
            --format sarif \
            > trivy-fs-results.sarif \
            || true

      - name: Upload Trivy FS SARIF → GitHub Code Scanning (Copilot Autofix)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

      - name: Upload Trivy FS reports (artifacts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-report
          path: |
            trivy-fs-results.json
            trivy-fs-results.sarif
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 3: Trivy – Container Image Scan
  # (only runs when a Dockerfile is present)
  # ─────────────────────────────────────────────
  trivy-image:
    name: "🐳 Trivy – Container Image Scan"
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_dockerfile == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Build Docker image and export to tar
        id: docker_build
        run: |
          echo "🔨 Building Docker image..."
          if docker build \
              --progress=plain \
              -t ai-vulnerability-scanner:${{ github.sha }} \
              . 2>&1 | tee docker-build.log; then
            echo "BUILD_SUCCESS=true" >> "$GITHUB_ENV"
            echo "✅ Docker build succeeded – saving to image.tar"
            docker save ai-vulnerability-scanner:${{ github.sha }} -o image.tar
            echo "✅ Image saved to image.tar ($(du -sh image.tar | cut -f1))"
          else
            echo "BUILD_SUCCESS=false" >> "$GITHUB_ENV"
            echo "❌ Docker build failed – see log above"
            exit 1
          fi

      - name: Upload Docker build log (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-build-log
          path: docker-build.log
          retention-days: 7

      - name: Run Trivy image scan on tar (JSON report – exit 0)
        if: env.BUILD_SUCCESS == 'true'
        run: |
          trivy image \
            --input image.tar \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 \
            --format json \
            > trivy-image-results.json
          echo "✅ Trivy image JSON written ($(wc -c < trivy-image-results.json) bytes)"

      - name: Run Trivy image scan on tar (SARIF report – for Copilot Autofix)
        if: env.BUILD_SUCCESS == 'true'
        run: |
          trivy image \
            --input image.tar \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 \
            --format sarif \
            > trivy-image-results.sarif
          echo "✅ Trivy image SARIF written ($(wc -c < trivy-image-results.sarif) bytes)"

      - name: Upload Trivy image SARIF → GitHub Code Scanning (Copilot Autofix)
        uses: github/codeql-action/upload-sarif@v3
        if: env.BUILD_SUCCESS == 'true'
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-container-image

      - name: Run Trivy image scan on tar (table – fail on CRITICAL/HIGH)
        if: env.BUILD_SUCCESS == 'true'
        run: |
          trivy image \
            --input image.tar \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --format table \
            || echo "TRIVY_IMAGE_FAILED=true" >> "$GITHUB_ENV"

      - name: Upload Trivy image reports (artifacts)
        uses: actions/upload-artifact@v4
        if: env.BUILD_SUCCESS == 'true'
        with:
          name: trivy-image-report
          path: |
            trivy-image-results.json
            trivy-image-results.sarif
          retention-days: 30

      - name: Fail if CRITICAL/HIGH vulnerabilities found
        if: env.TRIVY_IMAGE_FAILED == 'true'
        run: |
          echo "❌ Trivy found CRITICAL or HIGH vulnerabilities in the container image."
          echo "   Review the trivy-image-report artifact for details."
          exit 1

  # ─────────────────────────────────────────────
  # JOB 4: Grype – SCA Dependency Scan
  # ─────────────────────────────────────────────
  grype:
    name: "⚓ Grype – SCA Dependency Scan"
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install .
          fi

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run Grype scan (table – capture criticals flag)
        run: |
          grype dir:. --output table --fail-on critical \
            || echo "GRYPE_FOUND_CRITICALS=true" >> "$GITHUB_ENV"

      - name: Run Grype scan (JSON report – stdout redirect, always runs)
        if: always()
        run: |
          grype dir:. --output json > grype-results.json 2>/dev/null || true
          if [ -s grype-results.json ]; then
            echo "✅ Grype JSON report written ($(wc -c < grype-results.json) bytes)"
          else
            echo "⚠️  Grype JSON report is empty – writing placeholder"
            echo '{"matches":[],"source":{"type":"directory"},"note":"grype produced no output"}' \
              > grype-results.json
          fi

      - name: Convert Grype JSON → SARIF (for Copilot Autofix)
        if: always()
        run: |
          # Install grype's built-in SARIF template via anchore/grype
          grype dir:. --output sarif > grype-results.sarif 2>/dev/null || true
          if [ -s grype-results.sarif ]; then
            echo "✅ Grype SARIF written ($(wc -c < grype-results.sarif) bytes)"
          else
            echo "⚠️  Grype SARIF is empty – writing minimal valid SARIF placeholder"
            cat <<'EOF' > grype-results.sarif
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [{ "tool": { "driver": { "name": "Grype", "rules": [] } }, "results": [] }]
          }
          EOF
          fi

      - name: Upload Grype SARIF → GitHub Code Scanning (Copilot Autofix)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: grype-results.sarif
          category: grype-sca

      - name: Upload Grype reports (artifacts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-report
          path: |
            grype-results.json
            grype-results.sarif
          retention-days: 30

      - name: Fail if CRITICAL vulnerabilities found
        if: env.GRYPE_FOUND_CRITICALS == 'true'
        run: |
          echo "❌ Grype found CRITICAL vulnerabilities in dependencies."
          echo "   Review the grype-report artifact for details."
          exit 1

  # ─────────────────────────────────────────────
  # JOB 5: Summary – Aggregate all scan results
  # ─────────────────────────────────────────────
  scan-summary:
    name: "📋 Scan Summary"
    runs-on: ubuntu-latest
    needs: [ preflight, bandit, trivy-fs, grype, trivy-image ]
    if: always()

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: scan-reports

      - name: Print scan summary
        run: |
          echo "=============================================="
          echo "        SECURITY SCAN SUMMARY"
          echo "=============================================="
          echo ""
          echo "Jobs status:"
          echo "  🐍 Bandit  (SAST)          : ${{ needs.bandit.result }}"
          echo "  🔍 Trivy FS (deps/code)    : ${{ needs.trivy-fs.result }}"
          echo "  🐳 Trivy Image (container) : ${{ needs.trivy-image.result }}"
          echo "  ⚓ Grype   (SCA)           : ${{ needs.grype.result }}"
          echo ""
          echo "SARIF results uploaded to GitHub Code Scanning:"
          echo "  → Security tab → Code scanning alerts"
          echo "  → Copilot Autofix suggestions appear on PRs"
          echo ""
          echo "Reports also available as workflow artifacts:"
          echo "  → bandit-reports/  (txt, json, sarif)"
          echo "  → trivy-fs-report/ (json, sarif)"
          echo "  → trivy-image-report/ (json, sarif)"
          echo "  → grype-report/    (json, sarif)"
          echo "=============================================="

      - name: List downloaded report files
        run: find scan-reports -type f | sort || echo "No reports downloaded"