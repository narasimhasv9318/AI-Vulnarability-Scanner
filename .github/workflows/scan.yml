name: Security Vulnerability Scan

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  schedule:
    # Run every day at midnight UTC to catch newly disclosed CVEs
    - cron: "0 0 * * *"
  workflow_dispatch:

# Force Node.js 24 for all actions (Node 20 is deprecated from June 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: "3.11"

permissions:
  contents: read
  actions: read

jobs:
  # ─────────────────────────────────────────────
  # JOB 0: Pre-flight – detect repo characteristics
  # ─────────────────────────────────────────────
  preflight:
    name: "🔎 Pre-flight Checks"
    runs-on: ubuntu-latest
    outputs:
      has_dockerfile: ${{ steps.check.outputs.has_dockerfile }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: check
        run: |
          if [ -f "Dockerfile" ]; then
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
            echo "✅ Dockerfile found – container scan will run"
          else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No Dockerfile found – skipping container scan"
          fi

  # ─────────────────────────────────────────────
  # JOB 1: Bandit – Python Static Analysis (SAST)
  # ─────────────────────────────────────────────
  bandit:
    name: "🐍 Bandit – Python SAST"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit scan (text report)
        run: |
          bandit \
            --recursive . \
            --exclude ./.venv,./venv,./env,./.git,./tests \
            --severity-level medium \
            --confidence-level medium \
            --format text \
            --output bandit-report.txt \
            || true   # Don't fail – findings are reported via artifact

      - name: Print Bandit summary
        if: always()
        run: cat bandit-report.txt || echo "No bandit report generated"

      - name: Run Bandit scan (JSON report)
        if: always()
        run: |
          bandit \
            --recursive . \
            --exclude ./.venv,./venv,./env,./.git,./tests \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-report.json \
            || true

      - name: Upload Bandit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-reports
          path: |
            bandit-report.txt
            bandit-report.json
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 2: Trivy – Filesystem & Dependency Scan
  # ─────────────────────────────────────────────
  trivy-fs:
    name: "🔍 Trivy – Filesystem Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (table – informational)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."
          format: table
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"   # Never block; surface as artifact

      - name: Run Trivy filesystem scan (JSON report)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: fs
          scan-ref: "."
          format: json
          output: trivy-fs-results.json
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy FS report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-report
          path: trivy-fs-results.json
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 3: Trivy – Container Image Scan
  # (only runs when a Dockerfile is present)
  # ─────────────────────────────────────────────
  trivy-image:
    name: "🐳 Trivy – Container Image Scan"
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_dockerfile == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-vulnerability-scanner:${{ github.sha }} .

      - name: Run Trivy image scan (table – may fail on CRITICAL/HIGH)
        id: trivy_table
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ai-vulnerability-scanner:${{ github.sha }}
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "1"   # Fail the pipeline on critical container vulns
        continue-on-error: true   # Let the JSON step always run after this

      - name: Run Trivy image scan (JSON report – always runs)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: image
          image-ref: ai-vulnerability-scanner:${{ github.sha }}
          format: json
          output: trivy-image-results.json
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"   # Output step must never fail

      - name: Upload Trivy image report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-report
          path: trivy-image-results.json
          retention-days: 30

      # Re-fail the job explicitly after the artifact is safely uploaded
      - name: Fail if CRITICAL/HIGH vulnerabilities found
        if: steps.trivy_table.outcome == 'failure'
        run: |
          echo "❌ Trivy found CRITICAL or HIGH vulnerabilities in the container image."
          echo "   Review the trivy-image-report artifact for details."
          exit 1

  # ─────────────────────────────────────────────
  # JOB 4: Grype – SCA Dependency Scan
  # ─────────────────────────────────────────────
  grype:
    name: "⚓ Grype – SCA Dependency Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install .
          fi

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run Grype scan (table – captures exit code separately)
        id: grype_table
        run: |
          grype dir:. \
            --output table \
            --fail-on critical \
            || echo "GRYPE_FOUND_CRITICALS=true" >> "$GITHUB_ENV"

      - name: Run Grype scan (JSON report – always runs)
        if: always()
        run: |
          grype dir:. \
            --output json \
            --file grype-results.json \
            || true   # Exit code ignored here; we only need the file

      - name: Upload Grype report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-report
          path: grype-results.json
          retention-days: 30

      # Fail the job explicitly after artifact upload if criticals were found
      - name: Fail if CRITICAL vulnerabilities found
        if: env.GRYPE_FOUND_CRITICALS == 'true'
        run: |
          echo "❌ Grype found CRITICAL vulnerabilities in dependencies."
          echo "   Review the grype-report artifact for details."
          exit 1

  # ─────────────────────────────────────────────
  # JOB 5: Summary – Aggregate all scan results
  # ─────────────────────────────────────────────
  scan-summary:
    name: "📋 Scan Summary"
    runs-on: ubuntu-latest
    needs: [ preflight, bandit, trivy-fs, grype, trivy-image ]
    if: always()

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: scan-reports

      - name: Print scan summary
        run: |
          echo "=============================================="
          echo "        SECURITY SCAN SUMMARY"
          echo "=============================================="
          echo ""
          echo "Jobs status:"
          echo "  🐍 Bandit  (SAST)          : ${{ needs.bandit.result }}"
          echo "  🔍 Trivy FS (deps/code)    : ${{ needs.trivy-fs.result }}"
          echo "  🐳 Trivy Image (container) : ${{ needs.trivy-image.result }}"
          echo "  ⚓ Grype   (SCA)           : ${{ needs.grype.result }}"
          echo ""
          echo "Reports available in workflow artifacts:"
          echo "  → bandit-reports/bandit-report.txt"
          echo "  → bandit-reports/bandit-report.json"
          echo "  → trivy-fs-report/trivy-fs-results.json"
          echo "  → trivy-image-report/trivy-image-results.json"
          echo "  → grype-report/grype-results.json"
          echo "=============================================="

      - name: List downloaded report files
        run: find scan-reports -type f | sort || echo "No reports downloaded"