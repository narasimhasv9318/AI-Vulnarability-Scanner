name: Security Vulnerability Scan

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  # Suppress Node.js 20 deprecation warnings across all jobs
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read
  security-events: write  # Required for SARIF uploads → Copilot Autofix

jobs:
  # ─────────────────────────────────────────────
  # JOB 0: Pre-flight
  # ─────────────────────────────────────────────
  preflight:
    name: "🔎 Pre-flight Checks"
    runs-on: ubuntu-latest
    outputs:
      has_dockerfile: ${{ steps.check.outputs.has_dockerfile }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: check
        run: |
          if [ -f "Dockerfile" ]; then
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
            echo "✅ Dockerfile found – container scan will run"
          else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No Dockerfile found – skipping container scan"
          fi

  # ─────────────────────────────────────────────
  # JOB 1: Bandit – Python SAST
  # Blocks PR on: MEDIUM+ severity findings
  # ─────────────────────────────────────────────
  bandit:
    name: "🐍 Bandit – Python SAST"
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install bandit[sarif]

      - name: Run Bandit (text – printed to log)
        run: |
          bandit --recursive . \
            --exclude ./.venv,./venv,./env,./.git,./tests \
            --severity-level medium --confidence-level medium \
            --format text || true

      - name: Run Bandit (JSON artifact)
        if: always()
        run: |
          bandit --recursive . \
            --exclude ./.venv,./venv,./env,./.git,./tests \
            --severity-level medium --confidence-level medium \
            --format json --output bandit-report.json || true

      - name: Run Bandit (SARIF → Copilot Autofix)
        if: always()
        run: |
          bandit --recursive . \
            --exclude ./.venv,./venv,./env,./.git,./tests \
            --severity-level medium --confidence-level medium \
            --format sarif --output bandit-report.sarif || true

      - name: Upload Bandit SARIF → Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit-report.sarif
          category: bandit-sast

      - name: Upload Bandit artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-reports
          path: |
            bandit-report.json
            bandit-report.sarif
          retention-days: 30

      # ── GATE ──
      - name: "🚦 GATE – Fail if Bandit found issues"
        run: |
          bandit --recursive . \
            --exclude ./.venv,./venv,./env,./.git,./tests \
            --severity-level medium --confidence-level medium \
            --format text

  # ─────────────────────────────────────────────
  # JOB 2: Trivy – Filesystem Scan
  # Blocks PR on: CRITICAL or HIGH findings
  # ─────────────────────────────────────────────
  trivy-fs:
    name: "🔍 Trivy – Filesystem Scan"
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run Trivy FS (JSON artifact)
        if: always()
        run: |
          trivy fs . --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 --format json \
            > trivy-fs-results.json 2>&1 || true

      - name: Run Trivy FS (SARIF → Copilot Autofix)
        if: always()
        run: |
          trivy fs . --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 --format sarif \
            > trivy-fs-results.sarif || true

      - name: Upload Trivy FS SARIF → Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

      - name: Upload Trivy FS artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-report
          path: |
            trivy-fs-results.json
            trivy-fs-results.sarif
          retention-days: 30

      # ── GATE ──
      - name: "🚦 GATE – Fail if Trivy FS found CRITICAL/HIGH"
        run: |
          trivy fs . --severity CRITICAL,HIGH \
            --exit-code 1 --format table

  # ─────────────────────────────────────────────
  # JOB 3: Trivy – Container Image Scan
  # Blocks PR on: CRITICAL or HIGH findings
  # ─────────────────────────────────────────────
  trivy-image:
    name: "🐳 Trivy – Container Image Scan"
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_dockerfile == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Build Docker image and export to tar
        run: |
          if docker build --progress=plain \
              -t ai-vulnerability-scanner:${{ github.sha }} \
              . 2>&1 | tee docker-build.log; then
            echo "BUILD_SUCCESS=true" >> "$GITHUB_ENV"
            docker save ai-vulnerability-scanner:${{ github.sha }} -o image.tar
            echo "✅ Image saved ($(du -sh image.tar | cut -f1))"
          else
            echo "BUILD_SUCCESS=false" >> "$GITHUB_ENV"
            echo "❌ Docker build failed"; exit 1
          fi

      - name: Upload Docker build log (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-build-log
          path: docker-build.log
          retention-days: 7

      - name: Run Trivy image (JSON artifact)
        if: env.BUILD_SUCCESS == 'true'
        run: |
          trivy image --input image.tar \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 --format json \
            > trivy-image-results.json
          echo "✅ JSON written ($(wc -c < trivy-image-results.json) bytes)"

      - name: Run Trivy image (SARIF → Copilot Autofix)
        if: env.BUILD_SUCCESS == 'true'
        run: |
          trivy image --input image.tar \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 --format sarif \
            > trivy-image-results.sarif
          echo "✅ SARIF written ($(wc -c < trivy-image-results.sarif) bytes)"

      - name: Upload Trivy image SARIF → Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: env.BUILD_SUCCESS == 'true'
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-container-image

      - name: Upload Trivy image artifacts
        uses: actions/upload-artifact@v4
        if: env.BUILD_SUCCESS == 'true'
        with:
          name: trivy-image-report
          path: |
            trivy-image-results.json
            trivy-image-results.sarif
          retention-days: 30

      # ── GATE ──
      - name: "🚦 GATE – Fail if Trivy image found CRITICAL/HIGH"
        if: env.BUILD_SUCCESS == 'true'
        run: |
          trivy image --input image.tar \
            --severity CRITICAL,HIGH \
            --exit-code 1 --format table

  # ─────────────────────────────────────────────
  # JOB 4: Grype – SCA Dependency Scan
  # Blocks PR on: CRITICAL findings
  # ─────────────────────────────────────────────
  grype:
    name: "⚓ Grype – SCA Dependency Scan"
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then pip install .; fi

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run Grype (JSON artifact)
        if: always()
        run: |
          grype dir:. --output json > grype-results.json 2>/dev/null || true
          if [ ! -s grype-results.json ]; then
            echo '{"matches":[],"source":{"type":"directory"},"note":"grype produced no output"}' \
              > grype-results.json
          fi
          echo "✅ Grype JSON written ($(wc -c < grype-results.json) bytes)"

      - name: Run Grype (SARIF → Copilot Autofix)
        if: always()
        run: |
          grype dir:. --output sarif > grype-results.sarif 2>/dev/null || true
          if [ ! -s grype-results.sarif ]; then
            cat <<'EOF' > grype-results.sarif
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [{ "tool": { "driver": { "name": "Grype", "rules": [] } }, "results": [] }]
          }
          EOF
          fi
          echo "✅ Grype SARIF written ($(wc -c < grype-results.sarif) bytes)"

      - name: Upload Grype SARIF → Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: grype-results.sarif
          category: grype-sca

      - name: Upload Grype artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-report
          path: |
            grype-results.json
            grype-results.sarif
          retention-days: 30

      # ── GATE ──
      - name: "🚦 GATE – Fail if Grype found CRITICAL vulnerabilities"
        run: |
          grype dir:. --output table --fail-on critical

  # ─────────────────────────────────────────────
  # JOB 5: Consolidate & Deduplicate
  # Merges all tool reports, removes duplicate
  # findings, produces one JSON + one MD report
  # ─────────────────────────────────────────────
  consolidate:
    name: "🧹 Consolidate & Deduplicate Reports"
    runs-on: ubuntu-latest
    needs: [ bandit, trivy-fs, grype ]
    # Run even if scan jobs failed so we always get a consolidated view
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download bandit-reports
        uses: actions/download-artifact@v4
        with:
          name: bandit-reports
          path: raw-reports/bandit
        continue-on-error: true

      - name: Download trivy-fs-report
        uses: actions/download-artifact@v4
        with:
          name: trivy-fs-report
          path: raw-reports/trivy-fs
        continue-on-error: true

      - name: Download trivy-image-report
        uses: actions/download-artifact@v4
        with:
          name: trivy-image-report
          path: raw-reports/trivy-image
        continue-on-error: true

      - name: Download grype-report
        uses: actions/download-artifact@v4
        with:
          name: grype-report
          path: raw-reports/grype
        continue-on-error: true

      - name: Run consolidation script
        run: |
          python .github/scripts/consolidate_reports.py \
            --bandit      raw-reports/bandit/bandit-report.json \
            --trivy-fs    raw-reports/trivy-fs/trivy-fs-results.json \
            --trivy-image raw-reports/trivy-image/trivy-image-results.json \
            --grype       raw-reports/grype/grype-results.json \
            --output-json consolidated-report.json \
            --output-md   consolidated-report.md \
          || true   # Script exits 1 on CRITICAL/HIGH; gate job handles blocking

      - name: Print consolidated summary
        if: always()
        run: |
          echo "──────────────────────────────────────────"
          echo "  CONSOLIDATED REPORT SUMMARY"
          echo "──────────────────────────────────────────"
          # Print first 60 lines of the markdown (summary table)
          head -60 consolidated-report.md || true

      - name: Upload consolidated reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidated-report
          path: |
            consolidated-report.json
            consolidated-report.md
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 6: Security Gate (required status check)
  # Add "🔐 Security Gate" in:
  # Settings → Branches → Branch protection rules
  #   → Require status checks → search this name
  # ─────────────────────────────────────────────
  security-gate:
    name: "🔐 Security Gate"
    runs-on: ubuntu-latest
    needs: [ bandit, trivy-fs, grype, consolidate ]
    if: always()

    steps:
      - name: Download consolidated report
        uses: actions/download-artifact@v4
        with:
          name: consolidated-report
          path: consolidated
        continue-on-error: true

      - name: Evaluate results and block PR if needed
        run: |
          echo "=============================================="
          echo "         SECURITY GATE EVALUATION"
          echo "=============================================="
          echo ""
          echo "  🐍 Bandit   : ${{ needs.bandit.result }}"
          echo "  🔍 Trivy FS : ${{ needs.trivy-fs.result }}"
          echo "  ⚓ Grype    : ${{ needs.grype.result }}"
          echo "  🧹 Consolidate: ${{ needs.consolidate.result }}"
          echo ""

          FAILED=false

          if [ "${{ needs.bandit.result }}" = "failure" ]; then
            echo "  ❌ Bandit found MEDIUM+ severity issues in Python code"
            FAILED=true
          fi
          if [ "${{ needs.trivy-fs.result }}" = "failure" ]; then
            echo "  ❌ Trivy filesystem found CRITICAL/HIGH vulnerabilities"
            FAILED=true
          fi
          if [ "${{ needs.grype.result }}" = "failure" ]; then
            echo "  ❌ Grype found CRITICAL vulnerabilities in dependencies"
            FAILED=true
          fi

          # Also check consolidated report for any remaining CRITICAL/HIGH
          if [ -f consolidated/consolidated-report.json ]; then
            CRIT_HIGH=$(python3 -c "
          import json, sys
          data = json.load(open('consolidated/consolidated-report.json'))
          findings = [f for f in data.get('findings', []) if f['severity'] in ('CRITICAL','HIGH')]
          print(len(findings))
          ")
            echo "  📊 Consolidated CRITICAL/HIGH findings: $CRIT_HIGH"
            if [ "$CRIT_HIGH" -gt "0" ]; then
              echo "  ❌ $CRIT_HIGH CRITICAL/HIGH findings in consolidated report"
              FAILED=true
            fi
          fi

          echo ""
          if [ "$FAILED" = "true" ]; then
            echo "  🚫 PR MERGE BLOCKED"
            echo "  💡 Go to Security → Code scanning for Copilot Autofix suggestions"
            echo "  📄 Download 'consolidated-report' artifact for full deduplicated list"
            echo "=============================================="
            exit 1
          else
            echo "  ✅ All security gates passed – PR is clear to merge"
            echo "=============================================="
          fi

  # ─────────────────────────────────────────────
  # JOB 7: Final Summary
  # ─────────────────────────────────────────────
  scan-summary:
    name: "📋 Scan Summary"
    runs-on: ubuntu-latest
    needs: [ preflight, bandit, trivy-fs, grype, trivy-image, consolidate, security-gate ]
    if: always()

    steps:
      - name: Print final summary
        run: |
          echo "=============================================="
          echo "           FINAL PIPELINE SUMMARY"
          echo "=============================================="
          echo "  🔎 Pre-flight         : ${{ needs.preflight.result }}"
          echo "  🐍 Bandit  (SAST)     : ${{ needs.bandit.result }}"
          echo "  🔍 Trivy FS (deps)    : ${{ needs.trivy-fs.result }}"
          echo "  🐳 Trivy Image        : ${{ needs.trivy-image.result }}"
          echo "  ⚓ Grype   (SCA)      : ${{ needs.grype.result }}"
          echo "  🧹 Consolidate/Dedup  : ${{ needs.consolidate.result }}"
          echo "  🔐 Security Gate      : ${{ needs.security-gate.result }}"
          echo ""
          echo "  Artifacts produced:"
          echo "    → bandit-reports/          (json, sarif)"
          echo "    → trivy-fs-report/         (json, sarif)"
          echo "    → trivy-image-report/      (json, sarif)"
          echo "    → grype-report/            (json, sarif)"
          echo "    → consolidated-report/     (json ✨, md ✨)"
          echo ""
          echo "  SARIF → Security → Code scanning alerts"
          echo "  Copilot Autofix suggestions appear on PRs"
          echo "=============================================="